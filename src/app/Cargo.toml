[package]
name = "next-layer-app"
version = "0.1.2"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
libc = "0.2"
sha2 = "0.10"

[build-dependencies]
cxx-build = "1"
cxx-qt-build = "0.10"

[profile.dev]
debug = 1
