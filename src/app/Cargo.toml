[package]
name = "next-layer-app"
version = "0.1.2"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
flate2 = "1.1.11"
libc = "0.2"
serde_json = "1"
sha2 = "0.10"
ureq = "3.5.2"

[build-dependencies]
cxx-build = "1"
cxx-qt-build = "0.10"
qt-build-utils = "0.10"

[profile.dev]
debug = 1
