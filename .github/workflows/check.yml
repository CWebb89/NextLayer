name: check

# Only the static gates can run here. Everything else needs the built binary, and
# building one means compiling the slicing engine and its dependencies -- hours and
# tens of gigabytes on a hosted runner -- so the real gate set is `tools/check` on a
# machine that already has a build tree. This job exists to catch a broken fish
# script or a QML file that stops parsing before it reaches a push.
#
# The QML lint in particular cannot be measured here: the app's own types come from
# the compiled module, and without it every property reads as unknown. That gate says
# so and skips rather than reporting a number that means nothing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    name: static gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install fish, Qt 6 tools and the QML linter
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            fish qt6-base-dev-tools qt6-declarative-dev-tools

      - name: Put Qt's bin directory on PATH
        run: echo /usr/lib/qt6/bin >> "$GITHUB_PATH"

      - name: tools/check --static
        run: tools/check --static
