# One PrusaSlicer preset file, three presets: the shape "Export config" writes
# for a person who shares their profile. The gate imports this file alone -- no
# install around it, no vendor bundle -- and slices with what came out, so a
# translation that produces a preset the engine refuses fails here.
#
# Klipper on purpose: machine limits cannot go into Klipper G-code, and the engine
# refuses the combination outright rather than writing a file. An imported Klipper
# machine that leaves the answer at the default slices nothing at all.

[print:Gate File Process]
layer_height = 0.22
first_layer_height = 0.25
perimeters = 4
fill_density = 20%
fill_pattern = gyroid
top_solid_layers = 4
support_material = 1
support_material_style = organic
support_threshold_angle = 40

[filament:Gate File Filament]
filament_type = PLA
temperature = 215
first_layer_temperature = 220
bed_temperature = 60
first_layer_bed_temperature = 60
filament_max_volumetric_speed = 15
fan_min_speed = 35
fan_max_speed = 100

[printer:Gate File Printer]
bed_shape = 0x0,250x0,250x250,0x250
max_print_height = 240
nozzle_diameter = 0.4
gcode_flavor = klipper
printer_technology = FFF
use_relative_e_distances = 1
